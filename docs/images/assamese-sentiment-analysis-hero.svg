<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="700" viewBox="0 0 2200 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081526"/>
      <stop offset="0.56" stop-color="#102943"/>
      <stop offset="1" stop-color="#173b50"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6be4ca"/>
      <stop offset="1" stop-color="#75bff6"/>
    </linearGradient>
    <linearGradient id="barBest" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6be4ca"/>
      <stop offset="1" stop-color="#8ce7d2"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#d2f3fa" opacity="0.14"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#020812" flood-opacity="0.30"/>
    </filter>
  </defs>
  <rect width="2200" height="700" rx="28" fill="url(#bg)"/>
  <rect width="2200" height="700" rx="28" fill="url(#dots)"/>
  <circle cx="2100" cy="70" r="300" fill="#4cbbba" opacity="0.07"/>
  <circle cx="1950" cy="650" r="360" fill="#72baf2" opacity="0.06"/>
  <path d="M0 590 C280 500 420 690 700 600 S1100 480 1320 590" fill="none" stroke="#69dfce" stroke-width="2" opacity="0.13"/>
  <path d="M0 620 C300 530 500 700 800 620 S1120 520 1330 610" fill="none" stroke="#7bbcf4" stroke-width="2" opacity="0.10"/>

  <!-- left editorial panel -->
  <rect x="82" y="74" width="410" height="42" rx="21" fill="#153c50" stroke="#3a8393" stroke-opacity="0.75"/>
  <circle cx="108" cy="95" r="6" fill="#6be4ca"/>
  <text x="128" y="103" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3" fill="#a9e7df">LOW-RESOURCE INDIC NLP</text>
  <text x="82" y="213" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="60" font-weight="800" fill="#f5fbff" letter-spacing="0.2">ASSAMESE SENTIMENT</text>
  <text x="82" y="286" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="60" font-weight="800" fill="#f5fbff" letter-spacing="0.2">ANALYSIS</text>
  <rect x="82" y="316" width="160" height="6" rx="3" fill="url(#accent)"/>
  <text x="82" y="370" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="27" fill="#c0d5e4">A comparative benchmark of five model architectures</text>
  <text x="82" y="410" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="27" fill="#c0d5e4">for binary sentiment classification of Assamese reviews.</text>

  <!-- metric chips -->
  <g filter="url(#shadow)">
    <rect x="82" y="470" width="265" height="112" rx="18" fill="#102c42" stroke="#2b5268"/>
    <rect x="366" y="470" width="265" height="112" rx="18" fill="#102c42" stroke="#2b5268"/>
    <rect x="650" y="470" width="265" height="112" rx="18" fill="#102c42" stroke="#2b5268"/>
  </g>
  <text x="108" y="514" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="31" font-weight="800" fill="#f5fbff">8,986</text>
  <text x="108" y="549" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" fill="#9fb9cb">validated reviews</text>
  <text x="392" y="514" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="31" font-weight="800" fill="#f5fbff">2</text>
  <text x="392" y="549" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" fill="#9fb9cb">native-speaker annotators</text>
  <text x="676" y="514" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="31" font-weight="800" fill="#f5fbff">5 models</text>
  <text x="676" y="549" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" fill="#9fb9cb">from SVM to transformers</text>
  <text x="82" y="644" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="17" letter-spacing="1.2" fill="#6f91a9">DATASET • TRANSFER LEARNING • ERROR ANALYSIS</text>

  <!-- right results board -->
  <g filter="url(#shadow)">
    <rect x="1040" y="58" width="1080" height="584" rx="28" fill="#f5f8fb"/>
  </g>
  <text x="1100" y="117" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="2.5" fill="#527386">REPORTED TEST ACCURACY</text>
  <text x="1100" y="161" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="31" font-weight="800" fill="#102b3f">Five-model comparison</text>
  <text x="2048" y="159" text-anchor="end" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="17" fill="#718697">Accuracy (%)</text>
  <line x1="1100" y1="185" x2="2060" y2="185" stroke="#d6e1e8" stroke-width="2"/>

  <!-- rows -->
  <g font-family="Inter, Noto Sans, Arial, sans-serif">
    <text x="1100" y="237" font-size="22" font-weight="700" fill="#234255">SVM · TF-IDF</text>
    <rect x="1400" y="211" width="550" height="25" rx="12.5" fill="#e1eaf0"/>
    <rect x="1400" y="211" width="467.7" height="25" rx="12.5" fill="#8ca5b5"/>
    <text x="2028" y="232" text-anchor="end" font-size="21" font-weight="800" fill="#234255">85.04%</text>

    <text x="1100" y="310" font-size="22" font-weight="700" fill="#234255">IndicBERT</text>
    <rect x="1400" y="284" width="550" height="25" rx="12.5" fill="#e1eaf0"/>
    <rect x="1400" y="284" width="509.9" height="25" rx="12.5" fill="#79abc6"/>
    <text x="2028" y="305" text-anchor="end" font-size="21" font-weight="800" fill="#234255">92.71%</text>

    <text x="1100" y="383" font-size="22" font-weight="700" fill="#234255">CNN-BiLSTM</text>
    <rect x="1400" y="357" width="550" height="25" rx="12.5" fill="#e1eaf0"/>
    <rect x="1400" y="357" width="511.8" height="25" rx="12.5" fill="#6cabc6"/>
    <text x="2028" y="378" text-anchor="end" font-size="21" font-weight="800" fill="#234255">93.05%</text>

    <text x="1100" y="456" font-size="22" font-weight="700" fill="#234255">XLM-RoBERTa</text>
    <rect x="1400" y="430" width="550" height="25" rx="12.5" fill="#e1eaf0"/>
    <rect x="1400" y="430" width="521.8" height="25" rx="12.5" fill="#549fb8"/>
    <text x="2028" y="451" text-anchor="end" font-size="21" font-weight="800" fill="#234255">94.88%</text>

    <rect x="1080" y="480" width="1000" height="78" rx="16" fill="#e3f8f3" stroke="#a8e6d9"/>
    <text x="1100" y="527" font-size="22" font-weight="800" fill="#145d57">MuRIL</text>
    <rect x="1400" y="506" width="550" height="25" rx="12.5" fill="#c8e9e2"/>
    <rect x="1400" y="506" width="529.8" height="25" rx="12.5" fill="url(#barBest)"/>
    <text x="2028" y="527" text-anchor="end" font-size="21" font-weight="900" fill="#145d57">96.33%</text>
  </g>
  <text x="1100" y="602" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="16" fill="#718697">Reported results from this project's evaluation; performance may vary outside the evaluated data.</text>
</svg>
